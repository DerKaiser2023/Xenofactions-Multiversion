def verification = project.ext.archiveVerification
group = verification.base_package
def versionClassPath = verification.version_class.replace('{package_path}', verification.base_package.replace('.', '/'))
def versionClassName = versionClassPath.substring(versionClassPath.lastIndexOf('/') + 1).replace('.class', '')
def versionPackage = versionClassPath.substring(0, versionClassPath.lastIndexOf('/')).replace('/', '.')
def versionState = project.ext.modVersionState
def minecraftVersion = project.minecraftTarget
sourceSets.main.java.srcDir new File(repositoryRoot, 'common/src/main/java')
sourceSets.main.resources.srcDir new File(repositoryRoot, 'common/src/main/resources')
sourceSets.test.java.srcDir new File(repositoryRoot, 'common/src/test/java')
repositories { mavenCentral() }
dependencies { testImplementation 'junit:junit:4.13.2' }
if (project.minecraftTarget != '1.7.10') {
    java {
        sourceCompatibility = JavaVersion.toVersion(project.javaTarget)
        targetCompatibility = JavaVersion.toVersion(project.javaTarget)
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (project.javaTarget == 8 && minecraftVersion != '1.7.10') {
        // javac 8 uses source/target 8; newer compilers also enforce the Java 8 API surface.
        options.release.set(javaCompiler.map { it.metadata.languageVersion.asInt() > 8 ? 8 : null })
    }
    if (minecraftVersion in ['1.6.4', '1.8.9', '1.12.2']) {
        // Legacy source/bytecode levels are intentional; retain other warning categories.
        options.compilerArgs.add('-Xlint:-options')
    }
}

if (project.javaTarget == 8) apply from: new File(repositoryRoot, 'build-logic/java8-verification.gradle')

if (minecraftVersion in ['1.6.4', '1.8.9', '1.12.2']) {
    // Unimined adds these compiler annotations to minecraftLibraries by default.
    configurations.matching { it.name == 'minecraftLibraries' }.configureEach {
        exclude group: 'org.jetbrains', module: 'annotations'
    }
    dependencies { compileOnly 'org.jetbrains:annotations:24.0.1' }
}

def generatedJava = file("${buildDir}/generated/${verification.mod_id}/java")
sourceSets.main.java.srcDir generatedJava
task generateVersion {
    inputs.property('fullVersion', { versionState.fullVersion })
    inputs.property('versionClass', versionClassPath)
    outputs.dir generatedJava
    doLast {
        def destination = new File(generatedJava, versionClassPath.replace('.class', '.java'))
        destination.parentFile.mkdirs()
        destination.text = """package ${versionPackage};
public final class ${versionClassName} {
    public static final String VERSION = "${versionState.fullVersion}";
    private ${versionClassName}() {}
}
"""
    }
}
compileJava.dependsOn generateVersion
processResources {
    inputs.property('fullVersion', { versionState.fullVersion })
    filesMatching(['mcmod.info', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand(fullVersion: versionState.fullVersion, minecraftTarget: minecraftVersion)
    }
}

jar {
    manifest { attributes 'Implementation-Title': verification.display_name, 'Implementation-Version': project.fullVersion }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar.doFirst { manifest.attributes('Implementation-Version': versionState.fullVersion) }
