plugins { id 'com.gtnewhorizons.gtnhconvention' }
ext.repositoryRoot = file('../..')
ext.minecraftTarget = '1.7.10'
ext.loaderTarget = 'forge'
ext.loaderVersion = '1.7.10-10.13.4.1614-1.7.10'
ext.javaTarget = 8
apply from: '../../build-logic/version.gradle'
apply from: '../../build-logic/shared.gradle'
repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
}
dependencies {
    compileOnly 'info.journeymap:journeymap-api-forge:1.7.10-2.0.0'
    compileOnly 'com.github.GTNewHorizons:NotEnoughItems:2.8.114-GTNH:dev'
}
// Jabel compiler settings are owned by GTNH; shared sources still obey Java 8 APIs.
jar.finalizedBy 'reobfJar'
